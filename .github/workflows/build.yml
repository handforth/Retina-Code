# Builds both frontends on every push: Qt on Windows, macOS and Linux, and AppKit on macOS.
# Qt is the same 6.12.1 the build scripts expect, from Qt's own packages through aqtinstall.
# Every step writes to log.txt, and a failed job shows the log's end as an annotation on the run.
name: Build

on: push

defaults:
  run:
    shell: bash

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt
        run: pipx run --spec aqtinstall aqt install-qt windows desktop 6.12.1 win64_msvc2022_64 --outputdir 'C:\Qt' 2>&1 | tee -a log.txt; exit ${PIPESTATUS[0]}
      - name: Find Visual Studio
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          "VCVARS=$vs\VC\Auxiliary\Build\vcvars64.bat" >> $env:GITHUB_ENV
      - name: Build Qt
        env:
          QT: C:\Qt\6.12.1\msvc2022_64
        run: cmd //c build.bat 2>&1 | tee -a log.txt; exit ${PIPESTATUS[0]}
      - name: Show the log
        if: failure()
        run: tail -n 60 log.txt | awk 'BEGIN { printf "::error::" } { gsub(/%/, "%25"); gsub(/\r/, ""); printf "%s%%0A", $0 }'

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt
        run: pipx run --spec aqtinstall aqt install-qt linux desktop 6.12.1 linux_gcc_64 --outputdir "$HOME/Qt" 2>&1 | tee -a log.txt; exit ${PIPESTATUS[0]}
      - name: Build Qt
        run: ./build_linux_qt.sh 2>&1 | tee -a log.txt; exit ${PIPESTATUS[0]}
      - name: Show the log
        if: failure()
        run: tail -n 60 log.txt | awk 'BEGIN { printf "::error::" } { gsub(/%/, "%25"); gsub(/\r/, ""); printf "%s%%0A", $0 }'

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build AppKit
        run: ./build.sh 2>&1 | tee -a log.txt; exit ${PIPESTATUS[0]}
      - name: Install Qt
        run: pipx run --spec aqtinstall aqt install-qt mac desktop 6.12.1 clang_64 --outputdir "$HOME/Qt" 2>&1 | tee -a log.txt; exit ${PIPESTATUS[0]}
      - name: Build Qt
        run: ./build_mac_qt.sh 2>&1 | tee -a log.txt; exit ${PIPESTATUS[0]}
      - name: Show the log
        if: failure()
        run: tail -n 60 log.txt | awk 'BEGIN { printf "::error::" } { gsub(/%/, "%25"); gsub(/\r/, ""); printf "%s%%0A", $0 }'
