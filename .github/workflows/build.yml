# Builds both frontends on every push: Qt on Windows, macOS and Linux, and AppKit on macOS.
# Qt is the same 6.12.1 the build scripts expect, from Qt's own packages through aqtinstall.
# Every step writes to log.txt, and a failed job shows the log's end as an annotation on the run.
name: Build

on: push

defaults:
  run:
    shell: bash

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # aqtinstall doesn't read the per-compiler folders Qt uses on Windows yet, so this takes qtbase from Qt's
      # server, which unpacks to C:\Qt\6.12.1\msvc2022_64.
      - name: Install Qt
        run: |
          curl -fsSL -o qtbase.7z https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/qt6_6121/qt6_6121_msvc2022_64/qt.qt6.6121.win64_msvc2022_64/6.12.1-0-202611180427qtbase-Windows-Windows_11_24H2-MSVC2022-Windows-Windows_11_24H2-X86_64.7z 2>&1 | tee -a log.txt
          7z x -y -o'C:\Qt' qtbase.7z 2>&1 | tail -n 5 | tee -a log.txt; exit ${PIPESTATUS[0]}
      - name: Find Visual Studio
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          "VCVARS=$vs\VC\Auxiliary\Build\vcvars64.bat" >> $env:GITHUB_ENV
      - name: Build Qt
        env:
          QT: C:\Qt\6.12.1\msvc2022_64
        run: cmd //c build.bat 2>&1 | tee -a log.txt; exit ${PIPESTATUS[0]}
      - name: Show the log
        if: failure()
        run: tail -n 60 log.txt | awk 'BEGIN { printf "::error::" } { gsub(/%/, "%25"); gsub(/\r/, ""); printf "%s%%0A", $0 }'

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt
        run: pipx run --spec aqtinstall aqt install-qt linux desktop 6.12.1 linux_gcc_64 --outputdir "$HOME/Qt" 2>&1 | tee -a log.txt; exit ${PIPESTATUS[0]}
      # Qt's libraries link against the system's OpenGL and keyboard libraries, which the runner doesn't have.
      - name: Install libraries
        run: sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 2>&1 | tee -a log.txt; exit ${PIPESTATUS[0]}
      - name: Build Qt
        run: ./build_linux_qt.sh 2>&1 | tee -a log.txt; exit ${PIPESTATUS[0]}
      - name: Show the log
        if: failure()
        run: tail -n 60 log.txt | awk 'BEGIN { printf "::error::" } { gsub(/%/, "%25"); gsub(/\r/, ""); printf "%s%%0A", $0 }'

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build AppKit
        run: ./build.sh 2>&1 | tee -a log.txt; exit ${PIPESTATUS[0]}
      - name: Install Qt
        run: pipx run --spec aqtinstall aqt install-qt mac desktop 6.12.1 clang_64 --outputdir "$HOME/Qt" 2>&1 | tee -a log.txt; exit ${PIPESTATUS[0]}
      - name: Build Qt
        run: ./build_mac_qt.sh 2>&1 | tee -a log.txt; exit ${PIPESTATUS[0]}
      - name: Show the log
        if: failure()
        run: tail -n 60 log.txt | awk 'BEGIN { printf "::error::" } { gsub(/%/, "%25"); gsub(/\r/, ""); printf "%s%%0A", $0 }'
